name: Imagem AIVACS (GHCR)

# Compila a imagem Docker no GitHub e publica em
# ghcr.io/jonatascne-droid/insta-automation, para o EasyPanel só baixar pronta
# (compilar dentro do VPS pesaria nos outros serviços dele).
#
# Deploy automático (opcional): crie o secret EASYPANEL_DEPLOY_WEBHOOK com a
# URL de "Deploy Webhook" do app no EasyPanel. Sem ele, clique em Implantar.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aivacs-ghcr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jonatascne-droid/insta-automation
      DEPLOY_HOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Insta Automation (AIVACS)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o EasyPanel
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
